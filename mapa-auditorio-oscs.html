<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Mapa do Auditório — Distribuição das OSCs</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#10121a;--surf:#161921;--surf2:#1c2030;--brd:#252c3e;--txt:#dde2f0;--muted:#5a6480;--txt2:#b5b9c2;--acc:#5b7cf7}
body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex; /* Adicionado */
    flex-direction: column; /* Adicionado */
    overflow-x: hidden;
}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--brd);background:var(--surf);position:sticky;top:0;z-index:200}
header h1{font-size:13px;font-weight:500;line-height:1.3}
header span{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;margin-left:8px}
nav{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--brd);overflow-x:auto}
.tab{padding:7px 14px;border-radius:7px 7px 0 0;font-size:12px;cursor:pointer;color:var(--muted);border:1px solid transparent;border-bottom:none;transition:all .14s;white-space:nowrap}
.tab.on{background:var(--surf2);color:var(--txt);border-color:var(--brd)}
section{display:none;padding:14px 16px}
section.on{display:block}

#mapwrap{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:8px}
#svgmap{display:block;min-width:700px;width:100%;height:auto}

/* ── Tipos de cadeira ── */
/* Ocupada por escola */
.seat{cursor:pointer;transition:opacity .1s}
.seat:hover{opacity:.75}
.seat.dim{opacity:.06}
/* Vazia — contorno sutil */
.seat-empty{fill:none;stroke:rgba(255,255,255,0.13);stroke-width:0.55px;pointer-events:auto;cursor:default}
/* Reservada — cinza escuro semitransparente */
.seat-reserved{fill:rgba(120,130,160,0.22);stroke:rgba(180,190,220,0.28);stroke-width:0.55px;pointer-events:auto;cursor:default}

.tip{position:fixed;background:#1a1e2e;border:1px solid var(--brd);border-radius:8px;padding:9px 13px;font-size:12px;pointer-events:none;z-index:999;max-width:240px;line-height:1.6;box-shadow:0 6px 28px rgba(0,0,0,.65);display:none}
.tip b{font-size:13px;display:block;margin-bottom:2px}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stats{display:none}
.st{background:var(--surf);border:1px solid var(--brd);border-radius:7px;padding:8px 12px;min-width:80px}
.st label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block}
.st strong{font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;display:block;margin-top:1px}
.hint{font-size:12px;color:var(--txt2);margin-bottom:8px}

/* legenda de tipos */
.map-legend-types{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--muted)}
.map-legend-types span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block;flex-shrink:0}
.sw-school{background:var(--acc)}
.sw-reserved{background:rgba(120,130,160,0.4);border:1px solid rgba(180,190,220,0.4)}
.sw-empty{background:none;border:1px solid rgba(255,255,255,0.25)}

#legend{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:3px}
.li{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;cursor:pointer;transition:background .12s;font-size:11px}
.li:hover{background:var(--surf2)}.li.dim{opacity:.18}
.li-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.li-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sec{color:var(--muted);font-size:9px;flex-shrink:0}
.li-n{background:var(--surf2);color:var(--muted);font-size:9px;font-family:'IBM Plex Mono',monospace;padding:1px 4px;border-radius:3px;flex-shrink:0}

.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.sc{background:var(--surf);border:1px solid var(--brd);border-radius:9px;overflow:hidden}
.sc-hd{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--brd)}
.sc-bar{width:4px;height:28px;border-radius:2px;flex-shrink:0}
.sc-title{font-size:12px;font-weight:500}.sc-sub{font-size:10px;color:var(--muted);margin-top:1px}
.sr{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:11px;border-bottom:1px solid var(--brd)}
.sr:last-child{border-bottom:none}
.sr .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}.sr .nm{flex:1}
.sr .np{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}

.search{padding:0 0 12px}
.search input{width:100%;background:var(--surf);border:1px solid var(--brd);border-radius:6px;padding:7px 12px;color:var(--txt);font-size:13px;font-family:'IBM Plex Sans',sans-serif;outline:none}
.search input:focus{border-color:var(--acc)}.search input::placeholder{color:var(--muted)}
#fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px}
.fi{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--surf);border:1px solid var(--brd);border-radius:6px;cursor:pointer;transition:border-color .12s}
.fi:hover{border-color:var(--acc)}
.fi .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fi .nm{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .sec{font-size:9px;color:var(--muted)}.fi .np{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace}

/* Estilos do Rodapé / Marca D'água */
footer {
    padding: 24px 16px;
    border-top: 1px solid var(--brd);
    background: var(--surf);
    text-align: center;
    margin-top: auto; /* Empurra o rodapé para o fim da página */
}

.watermark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
    line-height: 1.6;
}


</style>
</head>

function colorForSchool(s) {
  const base = OSC_HUES[s.osc] ?? 225;
  const hue = (base + ((s.id % 7) - 3) * 5 + 360) % 360;
  const sat = 62 + (s.id % 3) * 7;
  const light = 48 + (s.id % 4) * 5;
  return `hsl(${hue} ${sat}% ${light}%)`;
}

// ─────────────────────────────────────────────────────────────
const svgEl = document.getElementById('svgmap');
const NS = 'http://www.w3.org/2000/svg';
const CX = 480;
let totalReserved = 0;

function R(d) { return d * Math.PI / 180; }

/**
 * Monta as cadeiras do setor usando preenchimento serpentina.
 *
 * Exemplo:
 * fileira 1: esquerda → direita
 * fileira 2: direita → esquerda
 * fileira 3: esquerda → direita
 *
 * Isso mantém os grupos espacialmente mais compactos.
 *
 * reservedRows usa índice 0 para a fileira mais próxima ao palco.
 */
function buildSlots(rowSeats, schools, reservedRows = [], reverseFill = false) {
  const reserved = new Set(reservedRows);
  const queue = [];

  schools.forEach(school => {
    for (let i = 0; i < school.p; i++) queue.push(school);
  });

  let rowIndices = rowSeats.map((_, index) => index);
  if (reverseFill) rowIndices.reverse();

  const rows = new Array(rowSeats.length);
  let queueIndex = 0;
  let activeRow = 0;

  rowIndices.forEach(rowIndex => {
    const seatsInRow = rowSeats[rowIndex];
    const slots = new Array(seatsInRow);

    if (reserved.has(rowIndex)) {
      for (let col = 0; col < seatsInRow; col++) {
        slots[col] = {
          type: "reserved",
          rowIndex,
          colIndex: col
        };
      }
      rows[rowIndex] = slots;
      return;
    }

    const leftToRight = activeRow % 2 === 0;

    for (let position = 0; position < seatsInRow; position++) {
      const colIndex = leftToRight
        ? position
        : seatsInRow - 1 - position;

      if (queueIndex < queue.length) {
        slots[colIndex] = {
          type: "school",
          school: queue[queueIndex++],
          rowIndex,
          colIndex
        };
      } else {
        slots[colIndex] = {
          type: "empty",
          rowIndex,
          colIndex
        };
      }
    }

    rows[rowIndex] = slots;
    activeRow++;
  });

  return rows;
}

function drawSector(
  cx, cy, rInner, rOuter,
  startDeg, endDeg,
  rowSeats, schools,
  reservedRows = [],
  reverseFill = false
) {
  const nRows = rowSeats.length;
  const rows = buildSlots(rowSeats, schools, reservedRows, reverseFill);
  const rowH = (rOuter - rInner) / nRows;
  const H_SEAT = rowH * 0.72;
  const GAP_ANG = R(0.35);
  const g = document.createElementNS(NS, 'g');

  rows.forEach((slots, ri) => {
    const rMid = rInner + ri * rowH + rowH / 2;
    const n = slots.length;
    if (n === 0) return;

    const spanRad = R(endDeg - startDeg);
    const seatAngW = (spanRad - (n + 1) * GAP_ANG) / n;

    slots.forEach((slot, si) => {
      const angCenter = R(startDeg) + GAP_ANG * (si + 1) + seatAngW * (si + 0.5);
      const mx = cx + rMid * Math.cos(angCenter);
      const my = cy - rMid * Math.sin(angCenter);
      const wSeat = Math.max(1, seatAngW * rMid);
      const hSeat = Math.max(1.5, H_SEAT);
      const rotDeg = -(angCenter * 180 / Math.PI) + 90;

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', -wSeat / 2);
      rect.setAttribute('y', -(hSeat / 2));
      rect.setAttribute('width', wSeat);
      rect.setAttribute('height', hSeat);
      rect.setAttribute('rx', Math.min(1.2, wSeat * 0.18));
      rect.setAttribute('transform', `translate(${mx},${my}) rotate(${rotDeg})`);

      if (slot.type === 'school') {
        rect.setAttribute('fill', SC[slot.school.id]);
        rect.setAttribute('class', 'seat');
        rect.setAttribute('stroke', '#10121a');
        rect.setAttribute('stroke-width', '0.4');

        rect.dataset.id = slot.school.id;
        rect.dataset.name = slot.school.name;
        rect.dataset.p = slot.school.p;
        rect.dataset.setor = slot.school.setor;
        rect.dataset.osc = slot.school.osc;
      } else if (slot.type === 'reserved') {
        rect.setAttribute('class', 'seat-reserved');
        totalReserved++;
      } else {
        rect.setAttribute('class', 'seat-empty');
      }

      g.appendChild(rect);
    });
  });

  svgEl.appendChild(g);
}

function arcLabel(cx, cy, rMid, a1, a2, lines) {
  const mid = R((a1 + a2) / 2);
  const x = cx + rMid * Math.cos(mid);
  const y = cy - rMid * Math.sin(mid);
  const lh = 12;
  const top = y - (lines.length - 1) * lh / 2;

  lines.forEach((l, i) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', top + i * lh);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('fill', `rgba(255,255,255,${l.a || 0.6})`);
    t.setAttribute('stroke', '#10121a');
    t.setAttribute('stroke-width', '0.8');
    t.setAttribute('paint-order', 'stroke fill');
    t.setAttribute('font-size', l.s || 9);
    t.setAttribute('font-weight', l.b ? '600' : '400');
    t.setAttribute('font-family', 'IBM Plex Sans,sans-serif');
    t.setAttribute('pointer-events', 'none');
    t.textContent = l.t;
    svgEl.appendChild(t);
  });
}

function floorLabel(y, txt) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', CX);
  t.setAttribute('y', y);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('fill', 'rgba(255,255,255,0.7)');
  t.setAttribute('font-size', '9.5');
  t.setAttribute('font-family', 'IBM Plex Sans,sans-serif');
  t.setAttribute('pointer-events', 'none');
  t.textContent = txt;
  svgEl.appendChild(t);
}

const tip = document.getElementById('tip');

svgEl.addEventListener('click', e => {
  const el = e.target.closest('.seat');
  if (!el) {
    clearHL();
    return;
  }
  toggleHL(+el.dataset.id);
});

svgEl.addEventListener('mouseover', e => {
  const el = e.target.closest('rect');
  if (!el) return;

  let content = "";

  if (el.classList.contains('seat')) {
    const s = SCHOOLS.find(x => x.id === +el.dataset.id);
    if (!s) return;

    content = `
      <b>
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;
        background:${SC[s.id]};margin-right:5px;vertical-align:middle"></span>
        ${s.name}
      </b>
      <span style="color:var(--muted);font-size:11px;display:block">${s.osc}</span>
      <span style="color:var(--muted);font-size:11px;display:block">${SETOR_CURTO[s.setor]}</span>
      <span style="color:#8899bb;font-size:11px">${s.p} pessoas</span>`;
  } else if (el.classList.contains('seat-reserved')) {
    content = `
      <b>Autoridades</b>
      <span style="color:var(--muted);font-size:11px">Fileira reservada</span>`;
  } else if (el.classList.contains('seat-empty')) {
    content = `
      <b>Cadeira Disponível</b>
      <span style="color:var(--muted);font-size:11px">Espaço livre</span>`;
  }

  if (content) {
    tip.innerHTML = content;
    tip.style.cssText = 'display:block;position:fixed;bottom:auto;transform:none';
  }
});

svgEl.addEventListener('mousemove', e => {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top = (e.clientY - 8) + 'px';
});

svgEl.addEventListener('mouseleave', () => {
  if (!activeId) tip.style.display = 'none';
});

function toggleHL(id) {
  if (activeId === id) {
    clearHL();
    return;
  }

  activeId = id;
  document.querySelectorAll('.seat').forEach(el =>
    el.classList.toggle('dim', +el.dataset.id !== id)
  );
  document.querySelectorAll('.li').forEach(el =>
    el.classList.toggle('dim', +el.dataset.id !== id)
  );

  const s = SCHOOLS.find(x => x.id === id);
  if (s) {
    tip.innerHTML = `
      <b>
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;
        background:${SC[s.id]};margin-right:5px;vertical-align:middle"></span>
        ${s.name}
      </b>
      <span style="color:var(--muted);font-size:11px;display:block">${s.osc}</span>
      <span style="color:var(--muted);font-size:11px;display:block">${SETOR_CURTO[s.setor]}</span>
      <span style="color:#8899bb;font-size:11px">${s.p} pessoas</span>`;

    tip.style.cssText =
      'display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:12px;top:auto';
  }
}

function clearHL() {
  activeId = null;
  document.querySelectorAll('.seat,.li').forEach(el => el.classList.remove('dim'));
  tip.style.display = 'none';
  tip.style.transform = '';
}

const fl = document.getElementById('fl');

function renderList(q = '') {
  fl.innerHTML = '';
  const term = q.trim().toLowerCase();

  const filtered = SCHOOLS
    .filter(s =>
      !term ||
      s.name.toLowerCase().includes(term) ||
      s.osc.toLowerCase().includes(term) ||
      SETOR_CURTO[s.setor].toLowerCase().includes(term)
    )
    .sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));

  filtered.forEach(s => {
    const d = document.createElement('div');
    d.className = 'fi';
    d.title = s.osc;

    d.innerHTML = `
      <div class="d" style="background:${SC[s.id]}"></div>
      <span class="nm">${s.name}<br>
        <small style="color:var(--muted)">${s.osc}</small>
      </span>
      <span class="sec">${SETOR_CURTO[s.setor]}</span>
      <span class="np">${s.p}p</span>`;

    d.addEventListener('click', () => {
      showTab('mapa');
      setTimeout(() => toggleHL(s.id), 80);
    });

    fl.appendChild(d);
  });
}

renderList();

function filtrar() {
  renderList(document.getElementById('search').value);
}

function showTab(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));

  document.getElementById('tab-' + id).classList.add('on');

  const idx = {mapa: 0, setores: 1, lista: 2}[id];
  const tab = document.querySelectorAll('.tab')[idx];
  if (tab) tab.classList.add('on');
}
